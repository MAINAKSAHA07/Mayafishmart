# Maya Ops (admin) — monorepo package under apps/admin
# Netlify site settings (required):
#   Base directory: (empty / repo root)
#   Package directory: apps/admin
#   Build command: npm run build --workspace=admin
#   Publish directory: apps/admin/.next
#
# Do NOT set Base directory to apps/admin — that breaks Next module resolution
# (Cannot find module 'next/dist/server/lib/start-server.js').
#
# Do NOT set functions.included_files for next/** — that conflicts with
# @netlify/plugin-nextjs and fails with ENOENT unlink on app-dir-module.js.

[build]
  command = "npm run build --workspace=admin"
  publish = "apps/admin/.next"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--include-workspace-root"

[[plugins]]
  package = "@netlify/plugin-nextjs"
